name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -v

  build:
    name: Build Windows exe
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write   # needed to attach the zip to a release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import meetingrec; print(meetingrec.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match meetingrec.__version__ ($version)"
            exit 1
          fi
      - name: Build and zip
        run: python build_exe.py --zip
      - uses: actions/upload-artifact@v7
        with:
          name: MeetingRecorder-windows-x64
          path: release/*
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.zip release/*.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.zip release/*.sha256 \
              --title "Meeting Recorder $GITHUB_REF_NAME" --generate-notes
          fi
