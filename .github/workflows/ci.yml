name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -v

  build:
    name: Build Windows exe
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write   # needed to attach the zip to a release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Pinned: from 3.14.7 the Windows builds ship Tcl/Tk 9 inside a zipfs
          # archive, which PyInstaller 6.20 doesn't bundle (the exe then crashes on
          # start). 3.14.4 has Tcl/Tk 8.6 on disk, like the tested local builds.
          python-version: "3.14.4"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import meetingrec; print(meetingrec.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match meetingrec.__version__ ($version)"
            exit 1
          fi
      - name: Build and zip
        run: python build_exe.py --zip
      - name: Smoke-test the exe
        shell: pwsh
        run: |
          # The app writes settings.json during start-up; a crash (e.g. missing
          # Tcl/Tk data) shows an "Unhandled exception" window instead.
          $sb = Join-Path $env:RUNNER_TEMP "smoke"
          $psi = New-Object System.Diagnostics.ProcessStartInfo (Resolve-Path "dist\MeetingRecorder\MeetingRecorder.exe")
          $psi.UseShellExecute = $false
          $psi.EnvironmentVariables["APPDATA"] = "$sb\appdata"
          $psi.EnvironmentVariables["OneDrive"] = "$sb\onedrive"
          $p = [System.Diagnostics.Process]::Start($psi)
          $settings = "$sb\appdata\MeetingRecorder\settings.json"
          $deadline = (Get-Date).AddSeconds(90)
          while (-not (Test-Path $settings) -and -not $p.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 3
          $p.Refresh()
          $title = $p.MainWindowTitle
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not (Test-Path $settings) -or $title -ne "Meeting Recorder") {
            Write-Error "The exe did not start properly (window title: '$title')"
            exit 1
          }
          "The exe started properly (window title: '$title')"
      - uses: actions/upload-artifact@v7
        with:
          name: MeetingRecorder-windows-x64
          path: release/*
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.zip release/*.sha256 --clobber
            exit 0
          fi
          # Release notes: this version's CHANGELOG.md section, plus the download details.
          awk -v v="${GITHUB_REF_NAME#v}" '$0 == "## " v {f=1; next} /^## / && f {exit} f' \
            CHANGELOG.md > notes.md
          zip=$(basename release/*.zip)
          sha=$(cut -d' ' -f1 release/*.sha256)
          cat >> notes.md <<NOTES

          ### Download
          \`$zip\` is a self-contained build for Windows 10/11 x64, with no Python needed. Unzip it to a short path and run \`MeetingRecorder.exe\`.
          SHA-256: \`$sha\`

          The build is not code-signed. If SmartScreen warns you, choose *More info → Run anyway*.
          ⚠️ Get the consent of all participants before recording.
          NOTES
          gh release create "$GITHUB_REF_NAME" release/*.zip release/*.sha256 \
            --title "Meeting Recorder $GITHUB_REF_NAME" --notes-file notes.md
