name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Linux - virtual display and audio devices
        if: runner.os == 'Linux'
        run: .github/linux-audio.sh
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            MR_DEVICE_TESTS=1 xvfb-run -a pytest -v -rs
          else
            pytest -v -rs
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-22.04     # older glibc, so the bundle also runs on older distributions
          - name: macos-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.4"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Linux - virtual display and audio devices
        if: runner.os == 'Linux'
        run: .github/linux-audio.sh
      - name: Install pinned build dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -m pip install -r requirements-build.txt
          else
            # The lock file is a Windows freeze; reuse its versions where they apply.
            python -m pip install -r requirements.txt pyinstaller -c requirements-build.txt
          fi
      - name: Check tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import meetingrec; print(meetingrec.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match meetingrec.__version__ ($version)"
            exit 1
          fi
      - name: Build
        shell: bash
        run: python build_exe.py --zip $([ "$RUNNER_OS" = "Windows" ] && echo --installer)
      - name: Smoke-test the build
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) python scripts/smoke_test.py dist/MeetingRecorder/MeetingRecorder.exe ;;
            macOS)   python scripts/smoke_test.py dist/MeetingRecorder.app ;;
            Linux)   xvfb-run -a python scripts/smoke_test.py dist/MeetingRecorder/MeetingRecorder ;;
          esac
      - name: macOS - check the app bundle
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict dist/MeetingRecorder.app
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" \
            dist/MeetingRecorder.app/Contents/Info.plist
      - name: Windows - install, start and uninstall with the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release\*-setup.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP "Meeting Recorder"
          Start-Process $setup -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/DIR=`"$dir`""
          if (-not (Test-Path "$dir\MeetingRecorder.exe")) { throw "The installer did not install the app" }
          $lnk = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Meeting Recorder.lnk"
          if (-not (Test-Path $lnk)) { throw "No Start menu shortcut at $lnk" }
          python scripts/smoke_test.py "$dir\MeetingRecorder.exe"
          if ($LASTEXITCODE) { throw "The installed app did not start properly" }
          Start-Process "$dir\unins000.exe" -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES"
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\MeetingRecorder.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\MeetingRecorder.exe") { throw "The uninstaller left the app behind" }
          "Installer OK: installed, started, uninstalled."
      - uses: actions/upload-artifact@v7
        with:
          name: MeetingRecorder-${{ matrix.name }}
          path: release/*

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            exit 0
          fi
          # Release notes: this version's CHANGELOG.md section, plus the downloads.
          awk -v v="${GITHUB_REF_NAME#v}" '$0 == "## " v {f=1; next} /^## / && f {exit} f' \
            CHANGELOG.md > notes.md
          {
            echo
            echo "### Downloads"
            echo "| File | For |"
            echo "|---|---|"
            for f in release/*; do
              case "$f" in
                *windows-x64-setup.exe) echo "| \`$(basename "$f")\` | **Windows 10/11 installer** (recommended) |" ;;
                *windows-x64.zip)       echo "| \`$(basename "$f")\` | Windows 10/11, portable (unzip and run) |" ;;
                *macos-arm64.zip)       echo "| \`$(basename "$f")\` | macOS on Apple Silicon (experimental) |" ;;
                *linux-x64.tar.gz)      echo "| \`$(basename "$f")\` | Linux x64 (experimental) |" ;;
              esac
            done
            echo
            echo "Each file has a \`.sha256\` checksum next to it. The builds are not code-signed:"
            echo "on Windows choose *More info → Run anyway* if SmartScreen warns you; on macOS,"
            echo "right-click the app and choose *Open* the first time. See the README for details."
            echo
            echo "⚠️ Get the consent of all participants before recording."
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Meeting Recorder $GITHUB_REF_NAME" --notes-file notes.md
