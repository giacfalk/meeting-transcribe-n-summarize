[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist", "release"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E221"]   # aligned assignments in the GUI constants are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: downloads a Whisper model and runs real transcription"]
